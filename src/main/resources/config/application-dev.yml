spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:cooperation;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      platform: h2
  jpa:
    open-in-view: true
  h2:
    console.enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Stub URI – NimbusJwtDecoder is built lazily; no real network call is
          # made at startup, so the ApplicationContext loads without a running
          # Keycloak instance. Tests that don't present a JWT token are unaffected.
          jwk-set-uri: http://localhost/test-jwks
logging:
  config: classpath:log4j2-dev.xml
